# Stage only after an authoritative A record for crm-api.plinkosolutions.com points to 159.89.94.127
# and Certbot has obtained /etc/letsencrypt/live/crm-api.plinkosolutions.com/{fullchain,privkey}.pem.
server {
    listen 80;
    listen [::]:80;
    server_name crm-api.plinkosolutions.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crm-api.plinkosolutions.com;

    ssl_certificate /etc/letsencrypt/live/crm-api.plinkosolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm-api.plinkosolutions.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 64k;

    location ^~ /crm/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    location / {
        return 404;
    }
}
